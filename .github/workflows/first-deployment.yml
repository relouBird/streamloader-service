name: First production deployment

on:
  workflow_dispatch:

concurrency:
  group: planethoster-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Initialize and deploy production
    runs-on: ubuntu-latest

    steps:
      - name: Initialize production through SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 5022 }}
          script_stop: true
          script: |
            set -e

            APP_ROOT="api"                       # relatif au HOME (format attendu par cloudlinux-selector)
            APP_DIR="$HOME/$APP_ROOT"
            ENTRYPOINT="passenger_wsgi.py"       # fichier de démarrage configuré dans le Python Selector
            REQUIREMENTS="requirements.txt"
            FFMPEG_DIR="$APP_DIR/ffmpeg"
            FFMPEG_BIN="$FFMPEG_DIR/ffmpeg"
            FFPROBE_BIN="$FFMPEG_DIR/ffprobe"
            ENTRYPOINT_FILE="$APP_DIR/$ENTRYPOINT"
            REPOSITORY="https://github.com/relouBird/streamloader-service.git"
            BRANCH="main"
            PY_ENV_ACTIVATE="$HOME/virtualenv/api/3.14/bin/activate"
            ENV_FILE="$APP_DIR/.env"

            if [ ! -f "$PY_ENV_ACTIVATE" ]; then
              echo "ERROR: Python environment not found: $PY_ENV_ACTIVATE"
              exit 1
            fi

            # CloudLinux's activation script reads optional unset variables.
            # Load it before enabling Bash nounset for the deployment itself.
            source "$PY_ENV_ACTIVATE"
            set -u

            if [ ! -d "$APP_DIR" ] || [ ! -f "$ENV_FILE" ] || [ ! -f "$ENTRYPOINT_FILE" ]; then
              echo "ERROR: Create $ENV_FILE and $ENTRYPOINT_FILE on the server before running this workflow."
              echo "The workflow never copies local .env files or GitHub secrets into the application directory."
              exit 1
            fi

            if [ ! -x "$FFMPEG_BIN" ] || [ ! -x "$FFPROBE_BIN" ]; then
              echo "ERROR: ffmpeg/ffprobe missing or not executable in $FFMPEG_DIR"
              echo "The workflow never uploads or generates these binaries."
              exit 1
            fi

            if [ -d "$APP_DIR/.git" ]; then
              echo "ERROR: Application already initialized. Use the normal deploy workflow."
              exit 1
            fi

            # Keep the production .env and initialize Git beside it.
            # Dotfiles are server-side configuration (for example .env* and
            # .htaccess) and must not block or be replaced by deployment.
            EXTRA_FILE="$(find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name '.*' ! -name 'ffmpeg' ! -name 'ffprobe' ! -name "$ENTRYPOINT" -print -quit)"
            if [ -n "$EXTRA_FILE" ]; then
              echo "ERROR: Existing directory contains unexpected files: $EXTRA_FILE"
              exit 1
            fi

            cd "$APP_DIR"
            git init
            git remote add origin "$REPOSITORY"
            git fetch --depth=1 origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"

            test -f "$APP_DIR/$REQUIREMENTS"

            python --version
            python -m pip install --upgrade pip
            python -m pip install --no-cache-dir -r "$REQUIREMENTS"

            # Fail early on syntax errors (no build step in Python).
            python -m compileall -q .

            # Documentation is not part of the runtime and must not be served
            # from the production application directory.
            find "$APP_DIR" -maxdepth 1 -type f -iname '*.md' -delete

            # Database initialization is non-destructive and runs at application startup.
            # It creates missing tables and applies additive migrations only.
            /usr/sbin/cloudlinux-selector restart \
              --json \
              --interpreter=python \
              --app-root="$APP_ROOT"

            echo "First deployment successful."